<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aranas Studio Photo Booth — Download</title>
<style>
  :root{
    --bg:#F4F6F8;--surface:#fff;--ink:#232A35;--muted:#7A8494;--line:#E3E8EE;
    --primary:#5B5BD6;--success:#12A150;--danger:#E5484D;--shadow:0 10px 30px rgba(35,42,53,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:18px}
  .wrap{max-width:620px;margin:0 auto}
  h1{font-size:20px;text-align:center;margin-bottom:2px}
  .ev{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  .pin-input{width:100%;padding:14px;font-size:34px;font-weight:800;letter-spacing:.3em;
    text-align:center;border:2px solid var(--line);border-radius:14px;color:var(--primary);
    background:var(--bg);outline:none;font-family:inherit}
  .pin-input:focus{border-color:var(--primary)}
  .btn{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;
    background:var(--primary);color:#fff;font:700 17px inherit;cursor:pointer}
  .btn:disabled{opacity:.4}
  .msg{text-align:center;font-weight:600;font-size:14px;margin-top:12px;min-height:20px;color:var(--muted)}
  .msg.err{color:var(--danger)}
  .grid{display:grid;gap:14px}
  .photo{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:var(--shadow)}
  .photo img{width:100%;display:block;background:#EEF1F5}
  .photo .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
  .photo .bar b{font-size:14px}
  .dl{background:var(--success);color:#fff;text-decoration:none;font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:10px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Aranas Studio Photo Booth</h1>
  <div class="ev" id="ev">Enter your PIN to download your photos</div>

  <div class="card" id="pinCard">
    <input id="pin" class="pin-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button class="btn" id="btn" onclick="load()">View my photos</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
/* Same Apps Script /exec URL as index.html */
const API_URL = 'https://script.google.com/macros/s/AKfycbwbSK3gnGnobXg8LCMaHwfr0w4AIVg24J7KfEJWzCtEyKQZcT2B4PMo_X0fXkgQ6Ff-gA/exec';

async function api(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  });
  const j = JSON.parse(await res.text());
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j.data;
}

function msg(t, err){
  const el = document.getElementById('msg');
  el.textContent = t || '';
  el.className = 'msg' + (err ? ' err' : '');
}

document.getElementById('pin').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,6);
});

function load(){
  const pin = document.getElementById('pin').value.replace(/\D/g,'');
  if (pin.length !== 6) return msg('Please enter your 6-digit PIN.', true);
  document.getElementById('btn').disabled = true;
  document.getElementById('grid').innerHTML = '';
  msg('Looking for your photos…');

  api('getPhotosByPin', { pin: pin })
    .then(d => {
      document.getElementById('btn').disabled = false;
      if (!d.ok) return msg(d.message, true);
      document.getElementById('title').textContent = d.boothTitle;
      document.getElementById('ev').textContent = d.eventName;
      msg(d.items.length + ' photos found — tap Download on each one.');
      document.getElementById('grid').innerHTML = d.items.map(it =>
        '<div class="photo"><img src="' + it.url + '" loading="lazy" alt="">' +
        '<div class="bar"><b>' + it.label + '</b>' +
        '<a class="dl" href="' + it.downloadUrl + '" target="_blank" rel="noopener">Download</a></div></div>'
      ).join('');
    })
    .catch(e => { document.getElementById('btn').disabled = false; msg(e.message, true); });
}

/* If the QR carried ?pin=..., prefill and load automatically */
(function(){
  const p = new URLSearchParams(location.search).get('pin');
  if (p && /^\d{6}$/.test(p)){ document.getElementById('pin').value = p; load(); }
})();
</script>
</body>
</html>
